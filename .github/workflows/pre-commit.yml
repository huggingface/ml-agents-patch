name: pre-commit

on:
  pull_request:
  push:
    branches:
     - main
     - develop
     - 'release/**'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e  # v2.3.4
      with:
        python-version: 3.8.x
    - uses: actions/setup-ruby@e932e7af67fc4a8fc77bd86b744acd4e42fe3543  # v1.1.3
      env:
        ImageOS: ubuntu20
      with:
        ruby-version: '2.6'
    - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815  # v3.4.2
      with:
        dotnet-version: '7.0.100'
    - name: Install manual dependencies
      run: |
        python -m pip install pre-commit
        pre-commit install
    - name: Run pre-commit
      run: |
        pre-commit run --all-files
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e  # v2.3.4
    - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8  # v2.5.2
      with:
        node-version: '12'
    - name: Install manual dependencies
    # pin markdown-link-check version to support multi-level reference link
      run: |
        sudo npm install -g markdown-link-check@3.8.7
        python -m pip install pre-commit
        pre-commit install
    - name: Run markdown checker
      run: |
        pre-commit run --hook-stage manual markdown-link-check --all-files
  validate-meta-files:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e  # v2.3.4
    - run: python utils/validate_meta_files.py
